name: Deploy Email Server to Render

on:
  push:
    branches: [main]
    paths:
      - 'email-server/**'
      - 'render.yaml'
      - '.github/workflows/deploy-email-server.yml'
  workflow_dispatch:

concurrency:
  group: 'email-server-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: email-server
        run: npm install

      - name: Build TypeScript
        working-directory: email-server
        run: npm run build

      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment..."
          curl -f -X POST "$DEPLOY_HOOK"
          echo "Render deploy successfully triggered."
