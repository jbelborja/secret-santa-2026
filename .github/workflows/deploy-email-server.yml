name: Deploy Email Server to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'email-server/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel Token
        id: check-token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice ::VERCEL_TOKEN secret not set in GitHub. If you connected your GitHub repo directly in Vercel's dashboard, Vercel will auto-deploy without this action."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        if: steps.check-token.outputs.has_token == 'true'
        run: npm install -g vercel

      - name: Pull Vercel environment
        if: steps.check-token.outputs.has_token == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_EMAIL_PROJECT_ID }}

      - name: Build
        if: steps.check-token.outputs.has_token == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_EMAIL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: steps.check-token.outputs.has_token == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_EMAIL_PROJECT_ID }}
