name: Deploy Web to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_HOSTING_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_HOSTING_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_EMAIL_SERVER_URL: ${{ secrets.EXPO_PUBLIC_EMAIL_SERVER_URL }}
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: secret-santa-2026-4f5f6
          channelId: live

      - name: Deploy Firestore Rules and Indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
            npx firebase-tools deploy --only firestore:rules,firestore:indexes --project secret-santa-2026-4f5f6 --non-interactive || echo "Firestore rules deployment notice: Verify service account permissions"
            rm -f sa.json
          else
            echo "Aviso: FIREBASE_SERVICE_ACCOUNT no configurado en secrets, omitiendo deploy de reglas"
          fi

      - name: Deploy Cloud Functions (Gmail SMTP Notifications)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'familiabelborja@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EXPO_PUBLIC_FIREBASE_HOSTING_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_HOSTING_URL || 'https://secret-santa-2026-4f5f6.web.app' }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json

            # Create production runtime .env for Cloud Functions from GitHub Actions secrets
            echo "SMTP_HOST=smtp.gmail.com" > functions/.env
            echo "SMTP_PORT=587" >> functions/.env
            echo "SMTP_USER=${SMTP_USER}" >> functions/.env
            echo "SMTP_PASSWORD=${SMTP_PASSWORD}" >> functions/.env
            echo "SMTP_FROM=${SMTP_USER}" >> functions/.env
            echo "EXPO_PUBLIC_FIREBASE_HOSTING_URL=${EXPO_PUBLIC_FIREBASE_HOSTING_URL}" >> functions/.env

            cd functions
            npm install
            npm run build
            cd ..

            npx firebase-tools deploy --only functions --project secret-santa-2026-4f5f6 --non-interactive || echo "Cloud Functions deploy notice: Verify Blaze plan and permissions"
            rm -f sa.json functions/.env
          else
            echo "Aviso: FIREBASE_SERVICE_ACCOUNT no configurado en secrets, omitiendo deploy de funciones"
          fi
